<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>LoginMaster - Login</title>

<link rel="stylesheet" href="css/style.css">
```

</head>

<body>

```
<div class="login-container">

    <div class="login-card">

        <h1>LoginMaster</h1>

        <h2>Iniciar sesión</h2>

        <form id="loginForm">

            <div class="form-group">

                <label for="usuario">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Ingrese su usuario"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingrese su contraseña"
                    required
                >

            </div>

            <button type="submit">
                Iniciar sesión
            </button>

            <div id="mensaje" class="mensaje"></div>

        </form>

    </div>

</div>

<script src="./js/login.js"></script>

</body>
</html>
